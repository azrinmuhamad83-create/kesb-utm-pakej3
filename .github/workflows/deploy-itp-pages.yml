name: Deploy ITP PWA to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/borang-itp/**"
      - ".github/workflows/deploy-itp-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload PWA site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/borang-itp

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
